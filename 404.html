<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Halaman Tidak Ditemukan</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0A0D14;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(5rem, 16vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #EF1B18, #E76720);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.2rem, 4vw, 1.75rem);
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      color: #94A3B8;
      font-size: 0.95rem;
      max-width: 420px;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #EF1B18;
      color: #FFF;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 20px rgba(239, 27, 24, 0.4);
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background: #D91512;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(239, 27, 24, 0.6);
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <h1>Halaman Tidak Ditemukan</h1>
  <p>Alamat yang kamu tuju tidak ada atau jalurnya salah ketik le.</p>
  <a href="/" class="btn-home">← Balik ke Beranda</a>
</body>
</html>
